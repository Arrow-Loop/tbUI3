<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tbUI3IDE Welcome | Shared WinUI control preview</title>
<style>
body { font-family: "Segoe UI", sans-serif; margin: 24px; }
#mount { width: min(880px, 95vw); height: min(690px, 80vh); border: 1px solid #888; }
pre { white-space: pre-wrap; overflow: auto; max-height: 180px; }
</style>
</head>
<body>
<h1>Welcome Wizard integration preview</h1>
<p>This is a development preview using the bundled shared WinUI control runtime and Master CSS. Native requests below are simulated in memory; no IDE, theme files, settings or updater components are modified.</p>
<p><button id="reopen" type="button">Reopen Welcome Wizard</button></p>
<div id="mount" aria-label="Wizard preview container"></div>
<h2>Simulated native state</h2><pre id="snapshot"></pre>
<h2>Sent native requests</h2><pre id="requests"></pre>
<script src="welcome.js"></script>
<script>
(async function () {
  const read=path=>fetch(path).then(response=>{if(!response.ok)throw Error('Missing '+path);return response.text();});
  const [masterCss,controlsJs,welcomeCss]=await Promise.all([
    read('master.css'),read('controls.js'),read('welcome.css')
  ]);
  const snap={
    schema:1,root:'C:\\twinBASIC',installationId:'demo-only',
    theme:'WinUI3 Light',toolbar:'Classic',
    preferences:{schema:1,strategy:'InPlace',automatic:true,restart:false,channel:'development'},
    bootstrap:{status:'ready',message:'Simulated bundled assets are ready.',resources:[
      {id:'updater',status:'ready',message:'Demo verified',repairable:false},
      {id:'themeDark',status:'ready',message:'Demo verified',repairable:false},
      {id:'themeLight',status:'modified',message:'Demo customization',repairable:true}
    ]},recovery:false,message:''
  };
  const output=document.querySelector('#snapshot'),logs=document.querySelector('#requests');
  const wizard=window.tbUI3CreateWelcomeWizard({
    document,mount:document.querySelector('#mount'),
    assets:{masterCss,controlsJs,welcomeCss},
    send(request) {
      logs.textContent+=JSON.stringify(request)+'\n';
      if(request.action==='choose-theme')snap.theme=request.name;
      if(request.action==='choose-toolbar')snap.toolbar=request.name;
      if(request.action==='installation-preferences')Object.assign(snap.preferences,request);
      snap.message='Simulated native acknowledgement: '+request.action;
      setTimeout(()=>{output.textContent=JSON.stringify(snap,null,2);wizard.setSnapshot(structuredClone(snap));},30);
    },
    confirmRepair:resource=>Promise.resolve(window.confirm('Simulate native confirmation for '+resource.id+'?'))
  });
  output.textContent=JSON.stringify(snap,null,2);
  wizard.open(structuredClone(snap));
  document.querySelector('#reopen').onclick=()=>wizard.open(structuredClone(snap));
})().catch(error=>document.querySelector('#requests').textContent='Preview assets failed to load: '+error.message);
</script>
</body>
</html>
